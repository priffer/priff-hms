<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - PRIFF HMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/supabase.js"></script>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white border border-gray-200 shadow-sm p-8">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-gray-900 tracking-wide">ADMIN LOGIN</h2>
      <p class="text-gray-500 text-sm mt-1">ระบบจัดการทรัพยากรบุคคล PRIFF HMS</p>
    </div>

    <div id="alertBox" class="hidden mb-6 p-4 border" role="alert"></div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">อีเมล</label>
        <input type="email" id="email" placeholder="กรอกอีเมลแอดมิน" required class="w-full border border-gray-300 p-3 focus:outline-none focus:border-kcblue focus:ring-1 focus:ring-kcblue">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="••••••••" required class="w-full border border-gray-300 p-3 focus:outline-none focus:border-kcblue focus:ring-1 focus:ring-kcblue">
      </div>
      
      <div class="pt-2">
        <button type="submit" id="loginBtn" class="w-full bg-gray-900 text-white font-bold py-3 hover:bg-black transition-colors border border-gray-900">เข้าสู่ระบบ</button>
      </div>
    </form>
    
    <div class="text-center mt-6">
      <a href="index.html" class="text-sm text-gray-500 hover:text-kcblue transition-colors">← กลับไปหน้าฟอร์มรับสมัครงาน</a>
    </div>
  </div>

  <script src="js/auth/login.js"></script>
  <script>
  document.getElementById('loginForm').addEventListener('submit', async function(event){
    event.preventDefault();
    const btn = document.getElementById('loginBtn');
    const alertBox = document.getElementById('alertBox');
    const identifier = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    btn.innerHTML = 'กำลังตรวจสอบ...'; btn.disabled=true;
    alertBox.style.display='none';
    try {
      let result;
      if (identifier.includes('@')) {
        // treat as email (admin)
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email: identifier, password });
        if (error) throw error;
        result = data;
      } else {
        // treat as emp_id -> synthetic login
        result = await window.PriffLogin.loginWithEmpId(identifier, password);
      }
      try { localStorage.removeItem('priff_emp_session'); } catch(e){}
      alertBox.className='alert alert-success mt-3';
      alertBox.innerHTML='✅ เข้าสู่ระบบสำเร็จ! กำลังพาท่านไปหน้าจัดการ...';
      alertBox.style.display='block';
      setTimeout(()=> window.location.href='dashboard.html',1000);
    } catch (err) {
      alertBox.className='alert alert-danger mt-3';
      alertBox.innerHTML='❌ '+ (err?.message || 'เข้าสู่ระบบไม่สำเร็จ');
      alertBox.style.display='block';
      btn.innerHTML='เข้าสู่ระบบ'; btn.disabled=false;
    }
  });
  </script>
</body>
</html>
