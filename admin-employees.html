<!DOCTYPE html>
<html lang="th" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการข้อมูลพนักงาน - PRIFF HMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config/supabase.js"></script>
    <script src="js/auth/auth-guard.js"></script>
    <style>body{visibility:hidden}</style>
    <link rel="stylesheet" href="dist/output.css">
    <style>
        .tab-active { background-color: #165DFF; color: white; border-color: #165DFF; border-radius: 0.75rem; }
        .tab-inactive { background-color: #EEF5FF; color: #0F2B73; border-color: #E6EDF7; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-kcsoft font-sans min-h-screen flex flex-col overflow-x-hidden">

    <div id="global-navbar"></div>

    <div class="max-w-7xl w-full mx-auto p-4 md:p-6 flex-1 min-w-0">
        <div class="bg-white rounded-[2rem] border border-[#e6edf7] p-4 md:p-6 shadow-[0_16px_30px_rgba(15,43,115,0.06)]">
            
            <!-- 🌟 แท็บสลับหน้า (ที่เคยหายไป ตอนนี้จะกลับมาแล้วครับ) -->
            <div class="flex flex-wrap gap-2 mb-6 border-b border-[#e6edf7] pb-4">
                <button onclick="switchEmpMainTab('directory')" id="mainTab-directory" class="px-6 py-2 font-bold border tab-active cursor-pointer transition-colors">👥 รายชื่อพนักงาน (Directory)</button>
                <button onclick="switchEmpMainTab('departments')" id="mainTab-departments" class="px-6 py-2 font-bold border tab-inactive cursor-pointer transition-colors hover:bg-[#e6edf7]">🏢 โครงสร้างองค์กรและแผนก</button>
            </div>

            <!-- หน้า: รายชื่อพนักงาน -->
            <div id="view-directory">
                <div class="flex justify-between items-end mb-4 border-b border-[#e6edf7] pb-4">
                    <div>
                        <h2 class="text-2xl font-extrabold text-kcdark">รายชื่อพนักงานทั้งหมด</h2>
                        <p class="text-sm text-slate-500 mt-1">จัดการข้อมูลพนักงานปัจจุบัน, ดูประวัติ, และสถานะการทำงาน</p>
                    </div>
                    <div class="flex gap-2">
                        <!-- 🚀 อัปเกรดเป็น Real-time Search: ใส่ oninput และเอาปุ่มค้นหาออกให้เรียบร้อย -->
                        <input type="text" id="searchInput" oninput="searchEmployees()" placeholder="🔍 ค้นหาชื่อ หรือ รหัสพนักงาน..." class="rounded-xl border border-[#e6edf7] p-2.5 text-sm outline-none focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] w-64 bg-white transition-all">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-kclight text-kcdark text-sm">
                                <th class="p-3 font-bold w-32 rounded-l-xl">รหัสพนักงาน</th>
                                <th class="p-3 font-bold">ชื่อ-นามสกุล</th>
                                <th class="p-3 font-bold">กลุ่มงาน / ตำแหน่ง</th>
                                <th class="p-3 font-bold">วันที่เริ่มงาน</th>
                                <th class="p-3 font-bold text-center rounded-r-xl">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="employeeListBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- หน้า: จัดการแผนก -->
            <div id="view-departments" class="hidden space-y-6">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-2xl font-extrabold text-kcdark">โครงสร้างแผนก (Departments)</h2>
                    <button onclick="document.getElementById('addDeptForm').classList.toggle('hidden')" class="rounded-xl bg-kcblue text-white font-bold px-4 py-2 hover:bg-kcdark transition-colors cursor-pointer shadow-sm">+ สร้างแผนกใหม่</button>
                </div>
                
                <!-- ฟอร์มสร้างแผนกใหม่ -->
                <div id="addDeptForm" class="hidden rounded-2xl bg-kcsoft border border-dashed border-[#e6edf7] p-5 mb-6">
                    <h3 class="font-bold text-kcdark mb-4 border-b border-[#e6edf7] pb-2">➕ สร้างแผนกใหม่เข้าสู่ระบบ</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">รหัสแผนกย่อ (เช่น SALES, CLEAN) <span class="text-red-500">*</span></label>
                            <input type="text" id="newDeptCode" class="w-full rounded-xl border border-[#e6edf7] p-2.5 outline-none uppercase focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-slate-700 mb-1">ชื่อเต็มแผนก/ฝ่าย <span class="text-red-500">*</span></label>
                            <input type="text" id="newDeptName" class="w-full rounded-xl border border-[#e6edf7] p-2.5 outline-none focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] transition-all">
                        </div>
                        <div class="md:col-span-3">
                            <label class="block text-sm font-bold text-slate-700 mb-1">รายละเอียดหน้าที่มีอะไรบ้าง?</label>
                            <input type="text" id="newDeptDesc" class="w-full rounded-xl border border-[#e6edf7] p-2.5 outline-none focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] transition-all text-sm">
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 mt-4">
                        <button onclick="document.getElementById('addDeptForm').classList.add('hidden')" class="rounded-xl bg-slate-200 text-slate-700 px-4 py-2 font-bold cursor-pointer border-0 hover:bg-slate-300 transition-colors">ยกเลิก</button>
                        <button onclick="saveNewDepartment()" class="rounded-xl bg-green-600 text-white px-6 py-2 font-bold cursor-pointer border-0 hover:bg-green-700 transition-colors">บันทึกแผนก</button>
                    </div>
                </div>

                <div id="deptCardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

        </div>
    </div>

    <div id="modalContainer"></div>
    
    <script src="js/components/navbar.js"></script>
    <script src="js/services/candidateService.js"></script>
    <script src="js/utils/uiHelper.js"></script> 
    <script src="js/pages/admin-employees.js"></script>
    <script>
    (async ()=>{
      const ok = await window.PriffAuthGuard.requireAuth(['admin','payroll']);
      if (!ok) return;
      const profile = await window.PriffAuthGuard.getCurrentUserProfile();
      window.currentUserProfile = profile;
      document.body.style.visibility = 'visible';
    })();
    </script>
</body>
</html>
