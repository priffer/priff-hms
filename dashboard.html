<!DOCTYPE html>
<html lang="th" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PRIFF HMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config/supabase.js"></script>
    <script src="js/auth/auth-guard.js"></script>
    <style>body{visibility:hidden}</style>
    <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-kcsoft font-sans min-h-screen flex flex-col overflow-x-hidden">
    
    <div id="global-navbar"></div>

    <div class="max-w-7xl w-full mx-auto p-4 md:p-6 flex-1 min-w-0">
        <div class="bg-white rounded-[2rem] border border-[#e6edf7] p-4 md:p-6 shadow-[0_16px_30px_rgba(15,43,115,0.06)]">
            
            <div class="flex flex-wrap gap-2 mb-6 border-b border-[#e6edf7] pb-4">
                <button onclick="switchTab('applied')" id="tab-applied" class="px-4 py-2 rounded-xl bg-kcblue text-white font-bold border-0 cursor-pointer transition-colors">ผู้สมัครใหม่</button>
                <button onclick="switchTab('interview')" id="tab-interview" class="px-4 py-2 rounded-xl bg-kclight text-kcdark font-bold border-0 cursor-pointer hover:bg-[#e6edf7] transition-colors">นัดสัมภาษณ์</button>
                <button onclick="switchTab('hired')" id="tab-hired" class="px-4 py-2 rounded-xl bg-kclight text-kcdark font-bold border-0 cursor-pointer hover:bg-[#e6edf7] transition-colors">รับเข้าทำงาน</button>
                <button onclick="switchTab('rejected')" id="tab-rejected" class="px-4 py-2 rounded-xl bg-kclight text-kcdark font-bold border-0 cursor-pointer hover:bg-[#e6edf7] transition-colors">ไม่ผ่านเกณฑ์</button>
                <button onclick="switchTab('settings')" id="tab-settings" class="px-4 py-2 rounded-xl bg-kclight text-kcdark font-bold border-0 cursor-pointer hover:bg-[#e6edf7] transition-colors ml-auto">⚙️ ตั้งค่าระบบ</button>
            </div>

            <div id="tableView" class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-kclight text-kcdark text-sm">
                            <th class="p-3 font-bold rounded-l-xl">วันที่สมัคร</th>
                            <th class="p-3 font-bold">ชื่อ-นามสกุล</th>
                            <th class="p-3 font-bold">กลุ่มงาน/ตำแหน่ง</th>
                            <th class="p-3 font-bold text-center rounded-r-xl">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody"></tbody>
                </table>
            </div>

            <div id="settingsView" class="hidden space-y-6">
                <h2 class="text-2xl font-extrabold text-kcdark border-b border-[#e6edf7] pb-3">ตั้งค่าระบบ (System Settings)</h2>
                <div>
                    <label class="block font-bold text-kcdark mb-2">ข้อความยินยอม PDPA (หน้าฟอร์มสมัครงาน)</label>
                    <textarea id="pdpaInput" rows="5" class="w-full rounded-xl border border-[#e6edf7] p-3 outline-none focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] transition-all"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">รหัสพนักงานล่าสุด (Running No.)</label>
                        <input type="text" id="lastEmpNo" class="w-full rounded-xl border border-[#e6edf7] p-2.5 outline-none focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">ภาษีหัก ณ ที่จ่าย (%)</label>
                        <input type="number" id="taxRate" class="w-full rounded-xl border border-[#e6edf7] p-2.5 outline-none focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">ประกันสังคม (%)</label>
                        <input type="number" id="ssoRate" class="w-full rounded-xl border border-[#e6edf7] p-2.5 outline-none focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] transition-all">
                    </div>
                </div>
                <button onclick="saveSettings()" class="rounded-2xl bg-kcblue text-white font-bold px-8 py-3 hover:bg-kcdark transition-colors shadow-sm cursor-pointer mt-4">บันทึกการตั้งค่าทั้งหมด</button>
            </div>

        </div>
    </div>

    <div id="modalContainer"></div>
    
    <script src="js/components/navbar.js"></script>
    <script src="js/services/candidateService.js"></script>
    <script src="js/utils/uiHelper.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script>
    (async ()=>{
      // Require auth for allowed roles before showing the page
      // Admin Portal: จำกัดเฉพาะ admin และ payroll เท่านั้น (employee/supervisor ต้องใช้ ESS Portal)
      const ok = await window.PriffAuthGuard.requireAuth(['admin','payroll']);
      if (!ok) return; // requireAuth will redirect as needed
      const profile = await window.PriffAuthGuard.getCurrentUserProfile();
      window.currentUserProfile = profile;
      // reveal page after successful auth
      document.body.style.visibility = 'visible';

      // Role-based UI adjustments
      const role = profile?.role || '';
      // Hide settings tab and view for non-admins
      if (role !== 'admin') {
        const settingsTab = document.getElementById('tab-settings');
        if (settingsTab) settingsTab.style.display = 'none';
        const settingsView = document.getElementById('settingsView');
        if (settingsView) settingsView.classList.add('hidden');
      }

      // Example: further UI toggles can be implemented by frontend team
      // e.g., hide payroll controls if role !== 'payroll' && role !== 'admin'

    })();
    </script>
    </body>
</html>
