<!DOCTYPE html>
<html lang="th" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - จัดการระบบและประกาศงาน | PRIFF HMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config/supabase.js"></script>
    <script src="js/auth/auth-guard.js"></script>
    <style>body{visibility:hidden}</style>
    <link rel="stylesheet" href="dist/output.css">
    <style>
        .tab-active { background-color: #165DFF; color: white; border-color: #165DFF; border-radius: 0.75rem; }
        .tab-inactive { background-color: #EEF5FF; color: #0F2B73; border-color: #E6EDF7; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-kcsoft font-sans min-h-screen flex flex-col overflow-x-hidden">

    <div id="global-navbar"></div>

    <div class="max-w-7xl w-full mx-auto p-4 md:p-6 flex-1 min-w-0">
        <div class="bg-white rounded-[2rem] border border-[#e6edf7] p-4 md:p-6 shadow-[0_16px_30px_rgba(15,43,115,0.06)]">
            
            <div class="flex flex-wrap gap-2 mb-6 border-b border-[#e6edf7] pb-4">
                <button onclick="switchAdminTab('cms')" id="tab-cms" class="px-6 py-2 font-bold border tab-active cursor-pointer transition-colors">🌐 จัดการหน้าเว็บ (CMS)</button>
                <button onclick="switchAdminTab('jobs')" id="tab-jobs" class="px-6 py-2 font-bold border tab-inactive cursor-pointer transition-colors hover:bg-kclight">📢 จัดการประกาศงาน</button>
            </div>

            <div id="view-cms" class="space-y-6">
                <h2 class="text-2xl font-extrabold text-kcdark">ตั้งค่าหน้าเว็บหลัก (Homepage)</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4 rounded-2xl bg-kcsoft p-4 border border-[#e6edf7]">
                        <h3 class="font-bold text-kcdark border-b border-[#e6edf7] pb-2">ข้อมูลบริษัท</h3>
                        
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">โลโก้บริษัท (แสดงบน Navbar หน้าเว็บหลัก)</label>
                            <div class="flex items-center gap-3">
                                <div id="logoPreview" class="w-12 h-12 bg-white rounded-xl border border-[#e6edf7] flex items-center justify-center overflow-hidden shrink-0">
                                    <span class="text-[10px] text-slate-400 font-bold">No Logo</span>
                                </div>
                                <input type="file" id="cmsLogo" accept="image/*" class="block w-full rounded-xl border border-[#e6edf7] bg-white text-sm cursor-pointer file:border-0 file:bg-kcdark file:text-white file:px-4 file:py-2 file:font-bold file:mr-3 hover:file:bg-kcblue transition-colors">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">ชื่อบริษัท (แสดงบน Navbar ข้างโลโก้)</label>
                            <input type="text" id="cmsCompanyName" class="w-full rounded-xl border border-[#e6edf7] p-2 outline-none focus:border-kcblue">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">หัวข้อหลัก (Headline)</label>
                            <input type="text" id="cmsHeadline" class="w-full rounded-xl border border-[#e6edf7] p-2 outline-none focus:border-kcblue">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">คำบรรยาย (Sub-headline)</label>
                            <textarea id="cmsSubhead" rows="3" class="w-full rounded-xl border border-[#e6edf7] p-2 outline-none focus:border-kcblue"></textarea>
                        </div>
                    </div>

                    <div class="space-y-4 rounded-2xl bg-kcsoft p-4 border border-[#e6edf7]">
                        <div class="flex justify-between items-center border-b border-[#e6edf7] pb-2">
                            <h3 class="font-bold text-kcdark">สวัสดิการพื้นฐาน</h3>
                            <button onclick="addWelfareInput()" class="rounded-xl bg-kcdark text-white text-xs px-2 py-1.5 font-bold hover:bg-kcblue cursor-pointer transition-colors">+ เพิ่มสวัสดิการ</button>
                        </div>
                        <div id="welfareContainer" class="space-y-2"></div>
                    </div>
                </div>

                <div class="pt-4 border-t border-[#e6edf7]">
                    <button onclick="saveCmsSettings()" class="rounded-2xl bg-kcblue text-white font-bold px-8 py-3 hover:bg-kcdark transition-colors cursor-pointer shadow-sm">บันทึกเนื้อหาหน้าเว็บ</button>
                </div>
            </div>

            <div id="view-jobs" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-extrabold text-kcdark">รายการประกาศงาน</h2>
                    <button onclick="openJobModal()" class="rounded-xl bg-kcblue text-white font-bold px-4 py-2 hover:bg-kcdark transition-colors cursor-pointer shadow-sm">+ สร้างประกาศงานใหม่</button>
                </div>

                <div class="overflow-x-auto rounded-2xl border border-[#e6edf7] bg-white">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-kclight text-kcdark text-sm">
                                <th class="p-3 font-bold">ตำแหน่งงาน</th>
                                <th class="p-3 font-bold">สถานที่ / โซน</th>
                                <th class="p-3 font-bold text-center">สถานะเปิดรับ</th>
                                <th class="p-3 font-bold text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="jobTableBody" class="text-sm text-slate-700"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div id="deleteConfirmModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2rem] p-6 shadow-[0_16px_40px_rgba(15,43,115,0.15)]">
            <h3 class="text-xl font-bold text-kcdark mb-2">ยืนยันการลบประกาศงาน?</h3>
            <p class="text-sm text-slate-600 mb-6">คุณกำลังจะลบประกาศงาน <span id="deleteTargetName" class="font-bold text-red-600"></span> ข้อมูลนี้จะถูกลบถาวรและไม่สามารถกู้คืนได้</p>
            <div class="flex justify-end gap-2">
                <button onclick="closeDeleteModal()" class="rounded-xl border border-[#e6edf7] bg-white text-slate-700 px-4 py-2 text-sm font-bold hover:bg-kclight transition-colors cursor-pointer">ยกเลิก</button>
                <button id="executeDeleteBtn" class="bg-red-600 text-white px-4 py-2 text-sm font-bold hover:bg-red-700 transition-colors cursor-pointer">ยืนยันการลบถาวร</button>
            </div>
        </div>
    </div>

    <div id="jobModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 items-center justify-center p-4">
        <div class="bg-white w-full max-w-3xl rounded-[2rem] shadow-[0_16px_40px_rgba(15,43,115,0.15)] flex flex-col max-h-[90vh]">
            
            <div class="p-6 border-b border-[#e6edf7] flex justify-between items-center bg-kcsoft shrink-0">
                <h3 class="text-xl font-bold text-kcdark uppercase tracking-wide" id="jobModalTitle">สร้างประกาศงานใหม่</h3>
                <button onclick="closeJobModal()" class="text-slate-400 hover:text-red-600 font-bold text-2xl transition-colors cursor-pointer leading-none">✕</button>
            </div>
            
            <div class="p-6 overflow-y-auto grow space-y-5">
                <input type="hidden" id="jobId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">ตำแหน่งงาน <span class="text-red-500">*</span></label>
                        <input type="text" id="jobTitle" required class="w-full rounded-xl border border-[#e6edf7] p-2 outline-none focus:border-kcblue">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">รายได้ / อัตราจ้าง <span class="text-red-500">*</span></label>
                        <input type="text" id="jobSalary" placeholder="เช่น 450 - 500 บาท/วัน" required class="w-full rounded-xl border border-[#e6edf7] p-2 outline-none focus:border-kcblue">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">ชื่อสถานที่ / โรงงาน</label>
                        <input type="text" id="jobCompanyName" placeholder="ปล่อยว่างได้ถ้ารับในนาม KC" class="w-full rounded-xl border border-[#e6edf7] p-2 outline-none focus:border-kcblue">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">โซนพื้นที่ปฏิบัติงาน <span class="text-red-500">*</span></label>
                        <input type="text" id="jobZone" placeholder="เช่น อมตะซิตี้ ชลบุรี" required class="w-full rounded-xl border border-[#e6edf7] p-2 outline-none focus:border-kcblue">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">รายละเอียดงานเพิ่มเติม</label>
                    <textarea id="jobContent" rows="5" placeholder="พิมพ์รายละเอียดงาน หรือสวัสดิการของตำแหน่งนี้..." class="w-full rounded-xl border border-[#e6edf7] p-3 outline-none focus:border-kcblue text-sm leading-relaxed"></textarea>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">รูปภาพโบรชัวร์ / ใบปลิวงาน</label>
                        <input type="file" id="jobFlyer" accept="image/*" class="block w-full rounded-xl border border-[#e6edf7] bg-white text-sm cursor-pointer file:border-0 file:bg-kcdark file:text-white file:px-4 file:py-2 file:font-bold file:mr-3 hover:file:bg-kcblue transition-colors">
                        <p id="jobFlyerPreviewInfo" class="text-xs text-blue-600 font-bold mt-1 hidden"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">ไฟล์รายละเอียดตำแหน่งงาน (PDF)</label>
                        <input type="file" id="jobPdf" accept="application/pdf" class="block w-full rounded-xl border border-[#e6edf7] bg-white text-sm cursor-pointer file:border-0 file:bg-kcdark file:text-white file:px-4 file:py-2 file:font-bold file:mr-3 hover:file:bg-kcblue transition-colors">
                        <p id="jobPdfPreviewInfo" class="text-xs text-blue-600 font-bold mt-1 hidden"></p>
                    </div>
                </div>
                
            </div>

            <div class="p-6 border-t border-[#e6edf7] bg-kcsoft flex justify-end gap-3 shrink-0">
                <button onclick="closeJobModal()" class="border border-[#e6edf7] bg-white text-slate-700 px-6 py-2 text-sm font-bold hover:bg-gray-100 transition-colors cursor-pointer">ยกเลิก</button>
                <button onclick="saveJob()" class="bg-kcblue text-white px-8 py-2 text-sm font-bold hover:bg-kcdark rounded-xl shadow-sm transition-colors cursor-pointer">บันทึกประกาศงาน</button>
            </div>
            
        </div>
    </div>
    
    <script src="js/components/navbar.js"></script>
    <script src="js/services/jobService.js"></script>
    <script src="js/services/cmsService.js"></script> 
    <script src="js/pages/admin-cms.js"></script>
    <script src="js/pages/admin-jobs.js"></script>
    <script>
    (async ()=>{
      // Admin Portal: จำกัดเฉพาะ admin และ payroll เท่านั้น (supervisor ต้องใช้ ESS Portal)
      const ok = await window.PriffAuthGuard.requireAuth(['admin','payroll']);
      if (!ok) return;
      document.body.style.visibility = 'visible';
      // load initial settings after auth
      if (typeof loadCmsSettings === 'function') loadCmsSettings();
    })();
    function switchAdminTab(tabName) {
            const viewCms = document.getElementById('view-cms');
            const viewJobs = document.getElementById('view-jobs');
            const btnCms = document.getElementById('tab-cms');
            const btnJobs = document.getElementById('tab-jobs');
            
            if (!viewCms || !viewJobs || !btnCms || !btnJobs) return;
            
            if (tabName === 'cms') {
                viewCms.classList.remove('hidden');
                viewJobs.classList.add('hidden');
                btnCms.className = 'px-6 py-2 font-bold border tab-active cursor-pointer transition-colors';
                btnJobs.className = 'px-6 py-2 font-bold border tab-inactive cursor-pointer transition-colors hover:bg-kclight';
            } else {
                viewCms.classList.add('hidden');
                viewJobs.classList.remove('hidden');
                btnCms.className = 'px-6 py-2 font-bold border tab-inactive cursor-pointer transition-colors hover:bg-kclight';
                btnJobs.className = 'px-6 py-2 font-bold border tab-active cursor-pointer transition-colors';
                
                if (typeof fetchJobs === 'function') {
                    fetchJobs();
                }
            }
        }
    </script>
</body>
</html>
