<!DOCTYPE html>
<html lang="th" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งรหัสผ่านใหม่ - PRIFF HMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/supabase.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kcblue: '#165DFF',
            kcdark: '#0F2B73',
            kclight: '#EEF5FF',
            kcyellow: '#FFC72C',
            kcsoft: '#F7FAFF',
            kcborder: '#E6EDF7'
          },
          fontFamily: { sans: ['Sarabun', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f7faff] font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-[2rem] border border-[#e6edf7] shadow-[0_16px_30px_rgba(15,43,115,0.06)] p-8">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-kcblue text-white font-black flex items-center justify-center text-xl shadow-md mx-auto mb-4">KC</div>
      <h2 class="text-2xl font-extrabold text-kcdark tracking-wide">ตั้งรหัสผ่านใหม่</h2>
      <p class="text-slate-500 text-sm mt-1 font-bold">PRIFF HMS</p>
    </div>

    <div id="alertBox" class="hidden mb-6 p-4 rounded-2xl text-center font-bold text-sm" role="alert"></div>

    <form id="resetForm" class="space-y-5">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">รหัสผ่านใหม่</label>
        <input type="password" id="newPassword" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required class="w-full rounded-xl border border-[#e6edf7] bg-white p-3 text-sm focus:outline-none focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] transition-all">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">ยืนยันรหัสผ่านใหม่</label>
        <input type="password" id="confirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="6" required class="w-full rounded-xl border border-[#e6edf7] bg-white p-3 text-sm focus:outline-none focus:border-kcblue focus:ring-4 focus:ring-[#eef5ff] transition-all">
      </div>

      <div class="pt-2">
        <button type="submit" id="resetBtn" class="w-full rounded-2xl bg-kcblue text-white font-bold py-3 shadow-sm hover:bg-kcdark transition-colors">บันทึกรหัสผ่านใหม่</button>
      </div>
    </form>

    <div class="text-center mt-6 space-y-2">
      <a href="login.html" class="block text-sm text-kcblue font-bold hover:underline">← กลับไปหน้าเข้าสู่ระบบ Admin</a>
    </div>
  </div>

  <script>
  const alertBox = document.getElementById('alertBox');
  const resetForm = document.getElementById('resetForm');
  const resetBtn = document.getElementById('resetBtn');

  function showAlert(msg, type) {
    const tone = type === 'success'
      ? 'bg-green-50 text-green-600 border border-green-100'
      : 'bg-red-50 text-red-600 border border-red-100';
    alertBox.className = 'mb-6 p-4 rounded-2xl text-center font-bold text-sm ' + tone;
    alertBox.innerHTML = msg;
    alertBox.style.display = 'block';
  }

  // Supabase ส่ง recovery token กลับมาทาง URL hash แล้ว fire เหตุการณ์ PASSWORD_RECOVERY
  // ให้ auth client จัดการ session อัตโนมัติ เราแค่ดักฟัง event เพื่อ enable ฟอร์ม
  let recoverySessionReady = false;
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) {
      recoverySessionReady = true;
    }
  });

  // เผื่อกรณี session ถูกตั้งไปแล้วก่อนที่ listener นี้จะติด (เช่น refresh หน้า)
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data?.session) recoverySessionReady = true;
  });

  resetForm.addEventListener('submit', async function (event) {
    event.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    alertBox.style.display = 'none';

    if (newPassword !== confirmPassword) {
      showAlert('❌ รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error');
      return;
    }
    if (newPassword.length < 6) {
      showAlert('❌ รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
      return;
    }

    resetBtn.innerHTML = 'กำลังบันทึก...'; resetBtn.disabled = true;
    try {
      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      if (error) throw error;
      showAlert('✅ ตั้งรหัสผ่านใหม่สำเร็จ! กำลังพาท่านไปหน้าเข้าสู่ระบบ...', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch (err) {
      showAlert('❌ ' + (err?.message || 'ไม่สามารถตั้งรหัสผ่านใหม่ได้ ลิงก์อาจหมดอายุ กรุณาขอลิงก์ใหม่'), 'error');
      resetBtn.innerHTML = 'บันทึกรหัสผ่านใหม่'; resetBtn.disabled = false;
    }
  });
  </script>
</body>
</html>
